<html>
    <head>
        <link rel="stylesheet" href="style/popup_style.css">
        <link rel="stylesheet" href="style/kit_style.css">
        <link rel="stylesheet" href="style/main_style.css">
        <link rel="stylesheet" href="style/stat_style.css">
        <link rel="stylesheet" href="style/text_style.css">
        <link rel="stylesheet" href="style/basic_info_style.css">
    </head>
    <body>
        <div id="buttons-col-1">
            <div id="char-info">
                <div id="class-box">
                    <label id="class-label">Class</label>
                    <div id="class-selector">
                        <button id="button-guard" class="class-button" onclick="SelectClass(this)"><img class="image-class" src="images/classes/guard.png"></button>
                        <button id="button-caster" class="class-button" onclick="SelectClass(this)"><img class="image-class" src="images/classes/caster.png"></button>
                        <button id="button-striker" class="class-button" onclick="SelectClass(this)"><img class="image-class" src="images/classes/striker.png"></button>
                        <button id="button-vanguard" class="class-button" onclick="SelectClass(this)"><img class="image-class" src="images/classes/vanguard.png"></button>
                        <button id="button-defender" class="class-button" onclick="SelectClass(this)"><img class="image-class" src="images/classes/defender.png"></button>
                        <button id="button-supporter" class="class-button" onclick="SelectClass(this)"><img class="image-class" src="images/classes/supporter.png"></button>                    
                    </div>
                </div>
                <div id="weapon-type-box">
                    <label>Weapon Type</label>
                    <div id="weapon-type-selector">
                        <button id="button-arts-unit" class="weapon-button" onclick="SelectWeapon(this)"><img class="image-weapon" src="images/weapons/arts-unit.png"></button>
                        <button id="button-great-sword" class="weapon-button" onclick="SelectWeapon(this)"><img class="image-weapon" src="images/weapons/great-sword.png"></button>
                        <button id="button-hand-cannon" class="weapon-button" onclick="SelectWeapon(this)"><img class="image-weapon" src="images/weapons/hand-cannon.png"></button>
                        <button id="button-polearm" class="weapon-button" onclick="SelectWeapon(this)"><img class="image-weapon" src="images/weapons/polearm.png"></button>
                        <button id="button-sword" class="weapon-button" onclick="SelectWeapon(this)"><img class="image-weapon" src="images/weapons/sword.png"></button>
                    </div>
                </div>
                <div id="name-box">
                    <label id="name-label">Name</label>
                    <input type="text" id="name-input">
                </div>
                <div id="char-element">

                </div>
                <div id="rarity-box">
                    <label id="rarity-label" class="generic-text-invisible">Rarity</label>
                    <img class="rarity-icon" src="images/op-rarity.png">
                    <img class="rarity-icon" src="images/op-rarity.png">
                    <img class="rarity-icon" src="images/op-rarity.png">
                    <button id="rarity-4-star-button" class="rarity-button" onclick="SelectRarity(this)" value="4">
                        <img class="rarity-icon" src="images/op-rarity.png">
                    </button>
                    <button id="rarity-5-star-button" class="rarity-button rarity-inactive" onclick="SelectRarity(this)" value="5">
                        <img id="rarity-5-img" class="rarity-icon" src="images/op-rarity.png">
                    </button>
                    <button id="rarity-6-star-button" class="rarity-button rarity-inactive" onclick="SelectRarity(this)" value="6">
                        <img id="rarity-6-img" class="rarity-icon" src="images/op-rarity.png">
                    </button>
                </div>
            </div>

            <div id="char-stats">
                <div id="str-box" class="stat-box">
                    <button id="str-stat-button" class="stat-button" onclick="PromoteStat(this)" value="1" data-type="str">
                        <img src="/images/stats/strength.png" id="str-img" class="inactive-stat stat-image">
                    </button>
                    <label id="str-label" class="stat-label stat-label-text">Strength</label>
                    <input type="number" id="str-val" class="stat-input stat-number">
                </div>
                <div id="agl-box" class="stat-box">
                    <button id="agl-stat-button" class="stat-button" onclick="PromoteStat(this)" value="1" data-type="agl">
                        <img src="/images/stats/agility.png" id="agl-img" class="inactive-stat stat-image">
                    </button>
                    <label id="agl-label" class="stat-label stat-label-text">Agility</label>
                    <input type="number" id="agl-val" class="stat-input stat-number">
                </div>
                <div id="int-box" class="stat-box">
                    <button id="int-stat-button" class="stat-button" onclick="PromoteStat(this)" value="1" data-type="int">
                        <img src="/images/stats/intellect.png" id="int-img" class="inactive-stat stat-image">
                    </button>
                    <label id="int-label" class="stat-label stat-label-text">Intellect</label>
                    <input type="number" id="int-val" class="stat-input stat-number">
                </div>
                <div id="wil-box" class="stat-box">
                    <button id="wil-stat-button" class="stat-button" onclick="PromoteStat(this)" value="1" data-type="wil">
                        <img src="/images/stats/will.png" id="wil-img" class="inactive-stat stat-image">
                    </button>
                    <label id="will-label" class="stat-label stat-label-text">Will</label>
                    <input type="number" id="wil-val" class="stat-input stat-number">
                </div>
            </div>

            <label id="skills-box-label">Skills</label>
            <div id="skills-boxes">
                <div id="skills-buttons">
                    <button id="batk-button" class="skill-button" onclick="SelectButton(this)" value="basic">BA</button>
                    <button id="bskl-button" class="skill-button" onclick="SelectButton(this)" value="battle">BS</button>
                    <button id="cskl-button" class="skill-button" onclick="SelectButton(this)" value="combo">CS</button>
                    <button id="uskl-button" class="skill-button" onclick="SelectButton(this)" value="ultimate">Ult</button>
                </div>
            </div>

            <div id="talents-boxes">
                <div id="talent-buttons">
                    <button id="talent-1-button" class="talent-button" onclick="SelectButton(this)" value="talent 1">Talent 1</button>
                    <button id="talent-2-button" class="talent-button" onclick="SelectButton(this)" value="talent 2">Talent 2</button>
                </div>
            </div>

            <div id="custom-keywords-box">
                <label id="custom=keyword-label">Custom Keywords</label>
                <input type="text" id="custom-keywords">
                <button id="custom-keywords-update-button" onclick="GetCustomKeywords()">Apply</button>
            </div>
        </div>

        <div id="display-box-column">
            <div id="popup-box" class="popup-box popup-box-invisible">

                <div class="popup-top-row">
                    <button class="popup-edit-button strip-style" onclick="ToggleEditBox(this)" value=""><img src="images/edit-icon.png" class="popup-edit-image"></button>
                    <label id="popup-label" class="popup-label sub-text"></label>
                </div>

                <input id="popup-name" type="text" class="popup-name" value=""><br>
                <label class="popup-rank-label"></label>
                <div class="popup-seperator-line"></div>

                <div class="popup-bot-row">
                    <textarea id="popup-edit" class="popup-edit edit-box-invisible"></textarea>
                    <div id="popup-display" class="popup-display body-text"></div>
                </div>

            </div>
        </div>
        <script src="script/button_selector.js"></script>
        <script src="script/handle_data.js"></script>
    </body>
</html>
